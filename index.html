
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моя кофейня</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f3ed;color:#30251f;font-family:Arial,sans-serif}
header{padding:28px 20px;background:#493328;color:white;border-radius:0 0 24px 24px}
header small{color:#e8d2bd}
h1{margin:8px 0;font-size:29px}
main{padding:20px;max-width:650px;margin:auto}
h2{font-size:20px}
.categories{display:flex;gap:8px;overflow:auto}
.categories button{border:0;border-radius:20px;padding:11px 15px;background:#e8dfd3;white-space:nowrap}
.categories button.active{background:#493328;color:white}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{background:white;border-radius:16px;padding:12px}
.pic{font-size:48px;background:#f1e8dc;border-radius:12px;text-align:center;padding:15px}
.card h3{margin:12px 0 5px;font-size:16px}
.price{font-weight:bold}
.add{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:#493328;color:white}
.cart{margin-top:22px;background:white;border-radius:16px;padding:16px}
.checkout{width:100%;padding:14px;border:0;border-radius:12px;background:#bd8054;color:white;font-weight:bold}
</style>
</head>
<body>
<header>
<small>ВАША ЛЮБИМАЯ КОФЕЙНЯ</small>
<h1>Кофе с собой ☕</h1>
<div>Выбирай любимое — забирай свежим</div>
</header>
<main>
<h2>Меню</h2>
<div class="categories">
<button class="active" onclick="filter('Все',this)">Все</button>
<button onclick="filter('Кофе',this)">Кофе</button>
<button onclick="filter('Холодные напитки',this)">Холодные</button>
<button onclick="filter('Другое',this)">Другое</button>
</div>
<div class="products" id="products"></div>
<div class="cart">
<h2>Корзина</h2>
<div id="cart">Пока пусто</div>
<p id="total">Итого: 0 ₽</p>
<button class="checkout" onclick="checkout()">Оформить самовывоз</button>
</div>
</main>
<script>
const items=[
{name:"Эспрессо",category:"Кофе",price:50,emoji:"☕"},
{name:"Капучино",category:"Кофе",price:80,emoji:"🥛"},
{name:"Латте",category:"Кофе",price:90,emoji:"☕"},
{name:"Айс-кофе",category:"Холодные напитки",price:100,emoji:"🧋"},
{name:"Чай",category:"Другое",price:50,emoji:"🍵"},
{name:"Круассан",category:"Другое",price:65,emoji:"🥐"}
];
let basket={};
let current="Все";
function filter(category,button){
current=category;
document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
renderProducts();
}
function renderProducts(){
document.getElementById("products").innerHTML=items.filter(x=>current==="Все"||x.category===current).map(x=>
`<div class="card"><div class="pic">${x.emoji}</div><h3>${x.name}</h3><div class="price">${x.price} ₽</div><button class="add" onclick="add('${x.name}')">Добавить +</button></div>`
).join("");
}
function add(name){basket[name]=(basket[name]||0)+1;renderCart()}
function renderCart(){
let names=Object.keys(basket);
document.getElementById("cart").innerHTML=names.length?names.map(n=>`${n} × ${basket[n]} <button onclick="basket['${n}']--;if(basket['${n}']<=0)delete basket['${n}'];renderCart()">−</button>`).join("<br>"):"Пока пусто";
let sum=items.reduce((s,x)=>s+x.price*(basket[x.name]||0),0);
document.getElementById("total").textContent="Итого: "+sum+" ₽";
}
function checkout(){
if(!Object.keys(basket).length){alert("Сначала добавь товары в корзину");return}
alert("Демонстрация: следующим этапом подключим регистрацию и отправку заказа в Telegram.");
}
renderProducts();
</script>
</body>
</html>
